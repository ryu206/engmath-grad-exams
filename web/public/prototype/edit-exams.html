<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>編輯考試資料</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --page-bg: #f7f8fb;
      --ink: #172033;
      --muted: #667085;
      --line: #d9dee8;
      --panel: #ffffff;
      --warning-soft: #fff7e6;
    }

    body {
      background: var(--page-bg);
      color: var(--ink);
      letter-spacing: 0;
    }

    .app-shell {
      max-width: 1120px;
    }

    .page-title {
      font-size: clamp(1.45rem, 2vw, 2rem);
      font-weight: 700;
    }

    .section-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .form-label {
      font-weight: 600;
      color: #344054;
    }

    .required-mark {
      color: #b42318;
    }

    .hint-text {
      color: var(--muted);
      font-size: .9rem;
    }

    .preview-area {
      min-height: 12rem;
      background: #fbfcff;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    .payload-box {
      min-height: 12rem;
      max-height: 26rem;
      overflow: auto;
      background: #111827;
      color: #d1e7dd;
      border-radius: 8px;
      font-size: .85rem;
      white-space: pre-wrap;
    }

    .badge-table {
      background: var(--warning-soft);
      color: #7a4b00;
      border: 1px solid #f7d48b;
    }

    .submit-status {
      min-height: 2.75rem;
    }
  </style>
</head>
<body>
  <main class="container-fluid app-shell py-4 py-lg-5">
    <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 mb-4">
      <div>
        <button class="btn btn-outline-secondary btn-sm mb-3" type="button" id="backBtn">返回</button>
        <h1 class="page-title mb-2">編輯考試資料</h1>
        <div class="text-secondary">修改 exams 資料，或將整筆資料標記為軟刪除。</div>
      </div>
      <span class="badge rounded-pill badge-table px-3 py-2 align-self-start">exams</span>
    </div>

    <form id="examEditForm" class="row g-4" novalidate>
      <div class="col-12 col-lg-7">
        <section class="section-panel p-3 p-md-4 mb-4">
          <div class="d-flex flex-column flex-sm-row justify-content-between gap-3 mb-3">
            <div>
              <h2 class="section-title mb-1">考試資料</h2>
              <div class="hint-text">目前編輯 exams.id = <span id="examIdText"></span></div>
            </div>
            <button class="btn btn-outline-danger btn-sm align-self-sm-start" type="button" id="deleteExamBtn">刪除資料</button>
          </div>

          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="sourceKind" class="form-label">來源類型 <span class="required-mark">*</span></label>
              <select class="form-select" id="sourceKind" required>
                <option value="graduate_exam">研究所考試</option>
                <option value="others">其他</option>
              </select>
            </div>

            <div class="col-12 d-none" id="otherTitleBox">
              <label for="examTitleInput" class="form-label">來源名稱 <span class="required-mark">*</span></label>
              <input type="text" class="form-control" id="examTitleInput" maxlength="255">
            </div>

            <div class="col-12 col-md-4 graduate-field">
              <label for="rocYear" class="form-label">年份 <span class="required-mark">*</span></label>
              <input type="number" class="form-control" id="rocYear" min="1" step="1" required>
            </div>

            <div class="col-12 col-md-8 graduate-field">
              <label for="university" class="form-label">大學 <span class="required-mark">*</span></label>
              <input type="text" class="form-control" id="university" required>
            </div>

            <div class="col-12 col-md-6 graduate-field">
              <label for="department" class="form-label">系所</label>
              <input type="text" class="form-control" id="department">
            </div>

            <div class="col-12 col-md-6 graduate-field">
              <label for="division" class="form-label">組別</label>
              <input type="text" class="form-control" id="division">
            </div>

            <div class="col-12 col-md-6 graduate-field">
              <label for="subjectPreset" class="form-label">科目</label>
              <select class="form-select" id="subjectPreset">
                <option value="">未設定</option>
                <option value="工程數學">工程數學</option>
                <option value="應用數學">應用數學</option>
                <option value="線性代數">線性代數</option>
                <option value="custom">自訂輸入</option>
              </select>
            </div>

            <div class="col-12 col-md-6 d-none graduate-field" id="customSubjectBox">
              <label for="customSubject" class="form-label">自訂科目</label>
              <input type="text" class="form-control" id="customSubject">
            </div>

            <div class="col-12 col-md-6 graduate-field">
              <label for="paper" class="form-label">卷別</label>
              <input type="text" class="form-control" id="paper">
            </div>

            <div class="col-12">
              <label for="source" class="form-label">來源網址</label>
              <input type="url" class="form-control" id="source" maxlength="2048">
              <div class="form-text">非必填，最多 2048 字元。</div>
            </div>
          </div>
        </section>

        <section class="section-panel p-3 p-md-4 mb-4">
          <h2 class="section-title mb-3">編輯提醒</h2>
          <div id="editIssues" class="vstack gap-2"></div>
        </section>

        <section class="section-panel p-3 p-md-4">
          <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
            <h2 class="section-title mb-0">更新 Payload 預覽</h2>
            <button class="btn btn-primary" type="submit">儲存更新</button>
          </div>
          <div id="submitStatus" class="submit-status mb-3"></div>
          <pre id="payloadPreview" class="payload-box p-3 mb-0"></pre>
        </section>
      </div>

      <aside class="col-12 col-lg-5">
        <section class="section-panel p-3 p-md-4">
          <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
            <h2 class="section-title mb-0">名稱預覽</h2>
            <button class="btn btn-outline-secondary btn-sm" type="button" id="refreshPreviewBtn">重新預覽</button>
          </div>
          <div class="preview-area p-3 p-md-4">
            <article id="examPreview"></article>
          </div>
        </section>
      </aside>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const examId = Number(params.get('id') || 1);
    const form = document.querySelector('#examEditForm');
    const sourceKind = document.querySelector('#sourceKind');
    const otherTitleBox = document.querySelector('#otherTitleBox');
    const examTitleInput = document.querySelector('#examTitleInput');
    const subjectPreset = document.querySelector('#subjectPreset');
    const customSubjectBox = document.querySelector('#customSubjectBox');
    const customSubject = document.querySelector('#customSubject');
    const sourceInput = document.querySelector('#source');
    const payloadPreview = document.querySelector('#payloadPreview');
    const examPreview = document.querySelector('#examPreview');
    const editIssues = document.querySelector('#editIssues');
    const submitStatus = document.querySelector('#submitStatus');
    const graduateRequired = ['#rocYear', '#university'];

    function value(selector) {
      return document.querySelector(selector).value.trim();
    }

    function numberOrNull(raw) {
      const trimmed = String(raw).trim();
      return trimmed === '' ? null : Number(trimmed);
    }

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function subjectValue() {
      return subjectPreset.value === 'custom' ? customSubject.value.trim() : subjectPreset.value;
    }

    function graduateTitle() {
      return [
        value('#rocYear'),
        value('#university'),
        value('#department'),
        value('#division'),
        subjectValue(),
        value('#paper')
      ].filter(Boolean).join('');
    }

    function currentTitle() {
      return sourceKind.value === 'graduate_exam' ? graduateTitle() : examTitleInput.value.trim();
    }

    function buildPayload() {
      const isGraduate = sourceKind.value === 'graduate_exam';
      return {
        exams: {
          id: examId,
          source_kind: sourceKind.value,
          title: isGraduate ? null : examTitleInput.value.trim(),
          source: sourceInput.value.trim() || null,
          roc_year: isGraduate ? numberOrNull(value('#rocYear')) : null,
          university: isGraduate ? value('#university') || null : null,
          department: isGraduate ? value('#department') || null : null,
          division: isGraduate ? value('#division') || null : null,
          subject: isGraduate ? subjectValue() || null : null,
          paper: isGraduate ? value('#paper') || null : null
        }
      };
    }

    function setSubmitStatus(type, message) {
      submitStatus.innerHTML = message
        ? `<div class="alert alert-${type} py-2 px-3 mb-0">${escapeHtml(message)}</div>`
        : '';
    }

    async function requestJson(url, options = {}) {
      const controller = new AbortController();
      const timeoutId = window.setTimeout(() => controller.abort(), 60000);

      try {
        const response = await fetch(url, {
          ...options,
          cache: 'no-store',
          signal: controller.signal
        });
        const result = await response.json().catch(() => null);

        if (!response.ok || !result?.success) {
          throw new Error(result?.message || '請求失敗');
        }

        return result;
      } catch (error) {
        if (error.name === 'AbortError') {
          throw new Error('請求逾時，請確認資料庫連線後再試一次。');
        }
        throw error;
      } finally {
        window.clearTimeout(timeoutId);
      }
    }

    function refreshSections() {
      const isGraduate = sourceKind.value === 'graduate_exam';
      document.querySelectorAll('.graduate-field').forEach((field) => {
        field.classList.toggle('d-none', !isGraduate);
      });
      otherTitleBox.classList.toggle('d-none', isGraduate);
      examTitleInput.required = !isGraduate;
      graduateRequired.forEach((selector) => {
        document.querySelector(selector).required = isGraduate;
      });
      const isCustom = isGraduate && subjectPreset.value === 'custom';
      customSubjectBox.classList.toggle('d-none', !isCustom);
    }

    function refreshPreview() {
      const title = currentTitle();
      const note = sourceKind.value === 'graduate_exam'
        ? '研究所考試的 title 會跟著規範欄位變動，正式值由後端產生。'
        : '其他來源的 title 由使用者輸入。';

      examPreview.innerHTML = title
        ? `<h3 class="h5 mb-3">${escapeHtml(title)}</h3><div class="hint-text mb-2">${escapeHtml(note)}</div>${sourceInput.value.trim() ? `<a class="small" href="${escapeHtml(sourceInput.value.trim())}" target="_blank" rel="noopener noreferrer">${escapeHtml(sourceInput.value.trim())}</a>` : ''}`
        : '<span class="text-secondary">請輸入必要欄位後預覽名稱。</span>';
    }

    function refreshPayload() {
      payloadPreview.textContent = JSON.stringify(buildPayload(), null, 2);
    }

    function refreshIssues() {
      const issues = [
        ['info', 'questions.exam_id 仍會指向同一筆 exams.id，因此修改 title 會影響所有已關聯題目的顯示。']
      ];

      if (sourceKind.value === 'others') {
        issues.push(['warning', '切換為其他來源並儲存後，年份、大學、系所、組別、科目、卷別會存成 NULL。']);
      } else {
        issues.push(['info', '研究所考試的 title 不接受手動輸入，會依規範欄位重新產生。']);
      }

      editIssues.innerHTML = issues
        .map(([type, text]) => `<div class="alert alert-${type} py-2 px-3 mb-0">${escapeHtml(text)}</div>`)
        .join('');
    }

    function refreshAll() {
      refreshSections();
      refreshPreview();
      refreshPayload();
      refreshIssues();
    }

    function fillExamForm(exam) {
      document.querySelector('#examIdText').textContent = exam.id;
      sourceKind.value = exam.source_kind || 'graduate_exam';
      examTitleInput.value = exam.title ?? '';
      document.querySelector('#rocYear').value = exam.roc_year ?? '';
      document.querySelector('#university').value = exam.university ?? '';
      document.querySelector('#department').value = exam.department ?? '';
      document.querySelector('#division').value = exam.division ?? '';
      document.querySelector('#paper').value = exam.paper ?? '';
      sourceInput.value = exam.source ?? '';
      customSubject.value = '';

      const presetValues = ['工程數學', '應用數學', '線性代數'];
      if (presetValues.includes(exam.subject)) {
        subjectPreset.value = exam.subject;
      } else if (exam.subject) {
        subjectPreset.value = 'custom';
        customSubject.value = exam.subject;
      } else {
        subjectPreset.value = '';
      }

      refreshAll();
      setSubmitStatus('success', '已載入考試資料，可以開始編輯。');
    }

    async function loadExam() {
      document.querySelector('#examIdText').textContent = examId;
      setSubmitStatus('info', '正在載入考試資料...');

      try {
        const result = await requestJson(`/api/admin/exams/${examId}`);
        fillExamForm(result.data);
      } catch (error) {
        setSubmitStatus('danger', error.message || '無法載入考試資料');
      }
    }

    async function updateExam() {
      setSubmitStatus('info', '正在更新資料...');

      try {
        const result = await requestJson(`/api/admin/exams/${examId}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(buildPayload())
        });

        setSubmitStatus('success', '已更新，正在重新載入編輯頁...');
        window.setTimeout(() => {
          window.location.href = result.data?.redirect_to || `/prototype/edit-exams.html?id=${examId}`;
        }, 600);
      } catch (error) {
        setSubmitStatus('danger', error.message || '更新失敗，請檢查欄位。');
      }
    }

    async function deleteExam() {
      setSubmitStatus('info', '正在刪除資料...');

      try {
        const result = await requestJson(`/api/admin/exams/${examId}`, {
          method: 'DELETE'
        });

        window.location.href = result.data?.redirect_to || '/prototype/exams-list.html';
      } catch (error) {
        setSubmitStatus('danger', error.message || '刪除失敗，請稍後再試。');
      }
    }

    document.querySelector('#deleteExamBtn').addEventListener('click', () => {
      if (!window.confirm('確定要刪除這筆考試資料嗎？這會以 soft delete 標記 deleted_at。')) {
        return;
      }
      deleteExam();
    });

    form.addEventListener('input', refreshAll);
    form.addEventListener('change', refreshAll);
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      form.classList.add('was-validated');
      refreshAll();
      if (form.checkValidity()) {
        await updateExam();
      }
    });

    document.querySelector('#refreshPreviewBtn').addEventListener('click', refreshPreview);
    document.querySelector('#backBtn').addEventListener('click', () => {
      if (document.referrer) {
        history.back();
      } else {
        window.location.href = '/prototype/exams-list.html';
      }
    });

    loadExam();
  </script>
</body>
</html>
