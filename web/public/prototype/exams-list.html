<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>考試資料列表</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --page-bg: #f7f8fb;
      --ink: #172033;
      --muted: #667085;
      --line: #d9dee8;
      --panel: #ffffff;
      --warning-soft: #fff7e6;
    }

    body {
      background: var(--page-bg);
      color: var(--ink);
      letter-spacing: 0;
    }

    .app-shell {
      max-width: 1120px;
    }

    .page-title {
      font-size: clamp(1.45rem, 2vw, 2rem);
      font-weight: 700;
    }

    .section-panel,
    .exam-item {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .exam-item {
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .exam-item:hover {
      border-color: #9ac9c0;
      box-shadow: 0 8px 24px rgba(16, 24, 40, .08);
    }

    .exam-link {
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .hint-text {
      color: var(--muted);
      font-size: .9rem;
    }

    .badge-table {
      background: var(--warning-soft);
      color: #7a4b00;
      border: 1px solid #f7d48b;
    }
  </style>
</head>
<body>
  <main class="container-fluid app-shell py-4 py-lg-5">
    <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 mb-4">
      <div>
        <h1 class="page-title mb-2">考試資料列表</h1>
        <div class="text-secondary">從 exams 資料表讀取資料，一筆 id 顯示成一個連結。</div>
      </div>
      <div class="d-flex flex-wrap gap-2 align-items-start">
        <a class="btn btn-primary btn-sm" href="exams.html">新增考試資料</a>
        <span class="badge rounded-pill badge-table px-3 py-2">exams</span>
      </div>
    </div>

    <section class="section-panel p-3 p-md-4 mb-4">
      <div class="row g-3 align-items-end">
        <div class="col-12 col-md-8">
          <label for="keyword" class="form-label">關鍵字</label>
          <input id="keyword" class="form-control" placeholder="可輸入年份、大學、系所、科目">
        </div>
        <div class="col-12 col-md-4">
          <label for="sortMode" class="form-label">排序</label>
          <select id="sortMode" class="form-select">
            <option value="roc_desc">年份新到舊</option>
            <option value="roc_asc">年份舊到新</option>
            <option value="name_asc">名稱 A-Z</option>
          </select>
        </div>
        <div class="col-12 col-md-4">
          <label for="pageSize" class="form-label">每頁筆數</label>
          <select id="pageSize" class="form-select">
            <option value="10">10 筆</option>
            <option value="20" selected>20 筆</option>
            <option value="50">50 筆</option>
            <option value="100">100 筆</option>
          </select>
        </div>
      </div>
    </section>

    <section class="section-panel p-3 p-md-4">
      <div class="d-flex justify-content-between gap-3 mb-3">
        <h2 class="h6 fw-bold mb-0">所有考試</h2>
        <span class="hint-text" id="resultCount"></span>
      </div>
      <div id="examList" class="vstack gap-3"></div>
      <nav class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mt-4" aria-label="考試資料分頁">
        <div class="hint-text" id="pageInfo"></div>
        <ul class="pagination mb-0 flex-wrap" id="pagination"></ul>
      </nav>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/prototype/staged-status.js"></script>
  <script>
    const examList = document.querySelector('#examList');
    const keyword = document.querySelector('#keyword');
    const sortMode = document.querySelector('#sortMode');
    const pageSize = document.querySelector('#pageSize');
    const resultCount = document.querySelector('#resultCount');
    const pageInfo = document.querySelector('#pageInfo');
    const pagination = document.querySelector('#pagination');

    let currentPage = 1;
    let requestController = null;

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function examTitle(exam) {
      return exam.title || '';
    }

    function pageButton(label, page, disabled = false, active = false) {
      return `
        <li class="page-item ${disabled ? 'disabled' : ''} ${active ? 'active' : ''}">
          <button class="page-link" type="button" data-page="${page}" ${disabled ? 'disabled' : ''}>${label}</button>
        </li>
      `;
    }

    function visiblePageNumbers(current, total) {
      const pages = new Set([1, total, current - 1, current, current + 1]);
      if (current <= 3) {
        pages.add(2);
        pages.add(3);
      }
      if (current >= total - 2) {
        pages.add(total - 1);
        pages.add(total - 2);
      }
      return [...pages].filter((page) => page >= 1 && page <= total).sort((a, b) => a - b);
    }

    function renderPagination(totalPages) {
      const normalizedTotalPages = Math.max(1, totalPages || 1);
      currentPage = Math.min(currentPage, normalizedTotalPages);
      const pages = visiblePageNumbers(currentPage, normalizedTotalPages);
      const items = [pageButton('上一頁', Math.max(1, currentPage - 1), currentPage === 1)];

      pages.forEach((page, index) => {
        if (index > 0 && page - pages[index - 1] > 1) {
          items.push('<li class="page-item disabled"><span class="page-link">...</span></li>');
        }
        items.push(pageButton(page, page, false, page === currentPage));
      });

      items.push(pageButton('下一頁', Math.min(normalizedTotalPages, currentPage + 1), currentPage === normalizedTotalPages));
      pagination.innerHTML = items.join('');
      pagination.querySelectorAll('button[data-page]').forEach((button) => {
        button.addEventListener('click', () => {
          currentPage = Number(button.dataset.page);
          render();
        });
      });
    }

    function renderList(exams, meta) {
      const start = (meta.page - 1) * meta.per_page;
      resultCount.textContent = `${meta.total} 筆`;
      pageInfo.textContent = meta.total > 0
        ? `第 ${meta.page} / ${meta.total_pages} 頁，顯示第 ${start + 1} - ${Math.min(start + meta.per_page, meta.total)} 筆`
        : '沒有資料';

      examList.innerHTML = exams.length > 0 ? exams.map((exam) => {
        const title = examTitle(exam) || `考試 #${exam.id}`;
        return `
          <article class="exam-item p-3">
            <div class="d-flex flex-column flex-md-row justify-content-between gap-3">
              <div>
                <a class="exam-link fs-5" href="exam-questions.html?exam_id=${exam.id}">${escapeHtml(title)}</a>
                <div class="hint-text mt-1">exams.id = ${exam.id}</div>
              </div>
              <div class="d-flex flex-wrap gap-2 align-self-md-start">
                <a class="btn btn-outline-secondary btn-sm" href="/prototype/edit-exams.html?id=${exam.id}">編輯</a>
                <a class="btn btn-outline-primary btn-sm" href="/prototype/exam-questions.html?exam_id=${exam.id}">查看題目</a>
              </div>
            </div>
          </article>
        `;
      }).join('') : '<div class="text-secondary border rounded-3 p-3 bg-light">沒有符合條件的考試資料。</div>';
      renderPagination(meta.total_pages);
    }

    async function render() {
      if (requestController) requestController.abort();
      requestController = new AbortController();
      const timeoutId = window.setTimeout(() => requestController.abort(), 60000);
      const status = createStagedStatus({
        setMessage: (stage) => {
          const className = stage.type === 'warning' ? 'alert alert-warning mb-0' : 'text-secondary border rounded-3 p-3 bg-light';
          examList.innerHTML = `<div class="${className}">${escapeHtml(stage.message)}</div>`;
        },
        stages: loadingStages('考試資料')
      });

      const params = new URLSearchParams({
        page: String(currentPage),
        per_page: pageSize.value,
        sort: sortMode.value
      });
      const query = keyword.value.trim();
      if (query) params.set('q', query);

      status.start();
      try {
        const response = await fetch(`/api/exams?${params.toString()}`, {
          signal: requestController.signal
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || '載入失敗。');
        renderList(result.data, result.meta);
      } catch (error) {
        if (error.name === 'AbortError') {
          examList.innerHTML = '<div class="alert alert-warning mb-0">載入逾時，請確認 XAMPP MySQL 是否啟動，或稍後再試。</div>';
        } else {
          examList.innerHTML = `<div class="alert alert-danger mb-0">${escapeHtml(error.message || '無法載入考試資料。')}</div>`;
        }
        pageInfo.textContent = '';
        pagination.innerHTML = '';
      } finally {
        status.stop();
        window.clearTimeout(timeoutId);
      }
    }

    keyword.addEventListener('input', () => {
      currentPage = 1;
      render();
    });
    sortMode.addEventListener('change', () => {
      currentPage = 1;
      render();
    });
    pageSize.addEventListener('change', () => {
      currentPage = 1;
      render();
    });

    render();
  </script>
</body>
</html>
